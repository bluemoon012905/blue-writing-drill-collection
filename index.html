<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Markdown Site</title>
</head>
<body>
  <div id="content"></div>

  <script>
    async function loadMarkdown(file) {
      const response = await fetch(file);
      let md = await response.text();

      // Extremely simple Markdown conversion
      md = md
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2">$1</a>')
        .replace(/\n/g, '<br>');

      document.getElementById('content').innerHTML = md;
    }

    loadMarkdown('index.md');
  </script>
</body>
</html>
